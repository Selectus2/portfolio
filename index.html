<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--head:start-->
    <!-- Route-specific tags. Everything between these markers is replaced per
         route by scripts/prerender.mjs from src/routes.tsx; the values below are
         the home route's, which is also what `vite dev` serves. -->
    <title>Vishwajeetsingh Desurkar — Ruby on Rails engineer in Pune</title>
    <meta
      name="description"
      content="Vishwajeetsingh Desurkar is a Pune-based Ruby on Rails engineer who organises the Pune Ruby meetups and Deccan Queen on Rails, and publishes open-source Ruby libraries on RubyGems."
    />
    <link rel="canonical" href="https://vishwajeetsingh.in/" />
    <meta property="og:url" content="https://vishwajeetsingh.in/" />
    <meta property="og:title" content="Vishwajeetsingh Desurkar — Ruby on Rails engineer in Pune" />
    <meta
      property="og:description"
      content="Vishwajeetsingh Desurkar is a Pune-based Ruby on Rails engineer who organises the Pune Ruby meetups and Deccan Queen on Rails, and publishes open-source Ruby libraries on RubyGems."
    />
    <!--head:end-->

    <meta name="author" content="Vishwajeetsingh Desurkar" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vishwajeetsingh Desurkar" />
    <!-- TODO(owner): drop a 1200x630 image at public/og.png. Until then link previews fall back to no image. -->
    <meta property="og:image" content="https://vishwajeetsingh.in/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Vishwajeetsingh Desurkar — Tech Problem Solver, Ruby conference speaker and community builder"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@VishwaDesurkar" />
    <meta name="twitter:creator" content="@VishwaDesurkar" />
    <meta name="twitter:image" content="https://vishwajeetsingh.in/og.png" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b1120" />

    <link
      rel="alternate"
      type="application/rss+xml"
      title="Vishwajeetsingh Desurkar — writing on Ruby and Rails"
      href="/feed.xml"
    />

    <!-- Plausible: cookieless, no personal data, nothing to consent to.
         Confirmed by the owner 2026-08-27. -->
    <script
      defer
      data-domain="vishwajeetsingh.in"
      src="https://plausible.io/js/script.js"
    ></script>


    <script>
      // Apply the stored theme before first paint so the page never flashes the
      // wrong palette. ThemeProvider reads the same key and re-applies on mount.
      (function () {
        try {
          var stored = localStorage.getItem("portfolio-theme");
          var theme =
            stored && stored !== "system"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
